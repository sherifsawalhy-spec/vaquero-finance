<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-title" content="Vaquero Finance">
<meta name="theme-color" content="#10243e">
<title>Vaquero Finance</title>
<link rel="manifest" href="https://sherifsawalhy-spec.github.io/vaquero-finance/manifest.json">
<link rel="apple-touch-icon" href="https://sherifsawalhy-spec.github.io/vaquero-finance/apple-touch-icon.png">
<link rel="icon" href="https://sherifsawalhy-spec.github.io/vaquero-finance/apple-touch-icon.png">
<style>
html,body{margin:0;height:100%;background:#10243e;color:#fff;font:16px -apple-system,BlinkMacSystemFont,Arial,sans-serif}
body{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;padding:24px;box-sizing:border-box;text-align:center}
img{width:96px;height:96px;border-radius:22px}
h1{margin:0;font-size:22px}
a.btn{display:inline-block;background:#c9a227;color:#10243e;font-weight:700;padding:14px 28px;border-radius:12px;text-decoration:none}
p{margin:0;opacity:.85;max-width:330px;line-height:1.5}
</style>
</head>
<body>
<img src="https://sherifsawalhy-spec.github.io/vaquero-finance/apple-touch-icon.png" alt="">
<h1>Vaquero Finance</h1>
<a class="btn" id="go" target="_blank" rel="noopener" href="https://script.google.com/a/macros/vaquerohospitality.com/s/AKfycbyNguFiwHdv_XV56bg1_Ams780Rfdwc7xq0ld-AcIx7HueNrtm5TVBsJmX_yuxg9fcNrA/exec">Open</a>
<p id="tip">Opening…</p>
<script>
// The apps need your Google sign-in, which only Safari itself has.
// - Home-screen icon (web app mode): hand the address to Safari (x-safari-https,
//   iOS 17+). If that doesn't open, the Open button opens it in Safari.
// - Normal Safari: go straight to the launcher.
// - Setup address (?setup=1) in Safari: stay here so Add to Home Screen picks up the icon.
var go = document.getElementById('go').href;
var tip = document.getElementById('tip');
var homeScreen = window.navigator.standalone || matchMedia('(display-mode: standalone)').matches;
if (homeScreen) {
  tip.textContent = 'Opening in Safari… If nothing happens, tap Open.';
  location.href = 'x-safari-' + go;
} else if (/[?&]setup=1/.test(location.search)) {
  tip.textContent = 'To add it to your iPhone: tap Share, then Add to Home Screen, then Add.';
} else {
  location.replace(go);
}
</script>
</body>
</html>
